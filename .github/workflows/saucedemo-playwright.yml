name: SauceDemo Playwright checks

on:
  push:
    branches: [main, feature/complete-test-documentation, feature/github-actions-playwright]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  playwright:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
